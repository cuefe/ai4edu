# 试点 / 测试环境一键部署：复制 .env.example 为 .env 并填写，然后 docker compose up -d --build
# 首次启动后执行迁移：docker compose run --rm api python -m app.cli migrate
# 生产环境数据库、Redis 用云托管服务，只部署 api、worker、web。上线步骤见 docs/试点上线清单.md
name: ai4edu

x-api-env: &api-env
  ENV: ${ENV:-dev}
  DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/ai4edu
  APP_DATABASE_URL: postgresql+psycopg://ai4edu_app:ai4edu_app@db:5432/ai4edu
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
  PHONE_HASH_KEY: ${PHONE_HASH_KEY:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
  TEACHER_DAILY_AI_TASKS: ${TEACHER_DAILY_AI_TASKS:-}
  STUDENT_DAILY_TUTOR_MESSAGES: ${STUDENT_DAILY_TUTOR_MESSAGES:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  STORAGE_DIR: /data/files

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai4edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai4edu"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  # api 接收上传，worker 解析，两者要挂同一个文件卷
  api:
    build: ../server
    environment:
      <<: *api-env
      # API 进程数。每个进程约 150 MB 内存，压测单进程约每秒 170 个请求（docs/压测记录.md）
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    volumes:
      - files:/data/files
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ../server
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info"]
    environment: *api-env
    volumes:
      - files:/data/files
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # 定时任务（周四提醒更新进度、周五发周测）。全局只能有一个 beat，否则任务会重复触发
  beat:
    build: ../server
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  files: # 老师上传的资料原文件、学生拍照作答的图片
