# 安全响应头。nginx 的 add_header 不会从上一层继承（location 里有 add_header 时 server 里的就失效），
# 所以 server 和每个带 add_header 的 location 都 include 这个文件。
# HSTS 在终止 HTTPS 的那一层（宿主机 Nginx 或 CDN）加，这里是 HTTP。
#
# CSP：脚本只能来自本站；Ant Design 用 <style> 注入样式，所以 style-src 要 'unsafe-inline'；
# 图片的 blob:、data: 是拍照预览和带登录态加载的图片。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
