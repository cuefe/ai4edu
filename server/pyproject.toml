[project]
name = "ai4edu-server"
version = "0.1.0"
description = "AI 中小学智教平台 · 后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "latex2mathml>=3.81.1",
    "markdown-it-py>=4.2.0",
    "mathml2omml>=0.0.2",
    "mdit-py-plugins>=0.6.1",
    "openai>=3.42.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pgserver>=0.1.4",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/ai/skills/*/prompt.py" = ["E501"]  # prompt 是成段的中文，按行宽折开反而难读
"app/ai/skills/*/__init__.py" = ["E501"]  # 小技能的 prompt 直接写在包里
