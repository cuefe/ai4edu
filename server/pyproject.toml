[project]
name = "ai4edu-server"
version = "0.1.0"
description = "AI 中小学智教平台 · 后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "python-pptx>=1.0.2",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
